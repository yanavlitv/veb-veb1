<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4285f4">
    <title>Система заявок студентов</title>
    <link rel="icon" href="favicon2.jpg" type="image/png">
    <link rel="stylesheet" href="css/style.css">
</head>
<button id="music-btn">Включить музыку</button>

<audio id="bg-music" loop>
    <source src="./song.mp3" type="audio/mpeg">
</audio>
<body>

    <header>
        <h1>Список студентов</h1>
        <a href="form.html" class="btn-add">Добавить нового студента</a>
    </header>

    <main>
         <div class="filters">
            <input type="text"   id="filter-group" placeholder="Группа (M3301)">
            <input type="number" id="filter-dorm"  placeholder="Общежитие" min="1">
            <select id="filter-isForeign">
                <option value="">Все</option>
                <option value="true">Иностранец</option>
                <option value="false">Не иностранец</option>
            </select>
            <button type="button" id="filter-btn">Применить</button>
            <button type="button" id="filter-reset">Сбросить</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ФИО</th>
                    <th>Группа</th>
                    <th>ИСУ ID</th>
                    <th>Общежитие</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="students-body">
                
            </tbody>
        </table>
    </main>

        <div id="student-dossier" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="dossier-info" class="dossier">
                <div class="dossier-header">
                    <h2 id="dossier-name">Имя студента</h2>
                </div>

                <div class="dossier-body">
                    <div class="dossier-row">
                        <span class="dossier-label">Группа:</span>
                        <span class="dossier-value" id="dossier-group">—</span>
                    </div>
                    <div class="dossier-row">
                        <span class="dossier-label">ИСУ ID:</span>
                        <span class="dossier-value" id="dossier-isu">—</span>
                    </div>
                    <div class="dossier-row">
                        <span class="dossier-label">Общежитие:</span>
                        <span class="dossier-value" id="dossier-dorm">—</span>
                    </div>
                    <div class="dossier-row">
                        <span class="dossier-label">Комната:</span>
                        <span class="dossier-value" id="dossier-room">—</span>
                    </div>
                    <div class="dossier-row">
                        <span class="dossier-label">Срок заселения:</span>
                        <span class="dossier-value" id="dossier-date">—</span>
                    </div>
                    <div class="dossier-row">
                        <span class="dossier-label">Иностранец:</span>
                        <span class="dossier-value" id="dossier-foreign">—</span>
                    </div>
                    <div class="dossier-row">
                        <span class="dossier-label">Заметки:</span>
                        <span class="dossier-value" id="dossier-notes">—</span>
                    </div>
                </div>

                <div class="dossier-actions">
                    <button class="btn-edit" id="dossier-edit-btn">Редактировать</button>
                    <button class="btn-delete" id="dossier-delete-btn">Удалить</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
